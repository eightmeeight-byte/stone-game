<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:radial-gradient(circle at 30% 20%,#6a5acd,#2b1d4a);overflow:hidden;touch-action:none;font-family:"Courier New",monospace}
body{display:flex;align-items:center;justify-content:center}
.gb{width:min(96vw,calc(96vh*0.6));aspect-ratio:0.6;background:linear-gradient(160deg,#ff7aa2,#b26cff 55%,#5a8cff);border-radius:12px 12px 60px 12px;padding:5% 6%;box-shadow:inset -4px -6px 0 #0003,inset 4px 4px 0 #fff5,0 10px 30px #0008;display:flex;flex-direction:column;position:relative}
.bezel{background:#23233a;border-radius:8px 8px 36px 8px;padding:6% 9% 4%;}
.lbl{color:#bbb;font-size:2.2vmin;letter-spacing:1px;margin-bottom:3%;display:flex;align-items:center;gap:4px}
.led{width:8px;height:8px;border-radius:50%;background:#400;display:inline-block}.led.on{background:#f22;box-shadow:0 0 6px #f22}
.scr{position:relative;width:100%;aspect-ratio:160/144;overflow:hidden;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:bold;color:#fff}
canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#9bbc0f}
.brand{color:#fff;text-shadow:2px 2px 0 #5a1a6a;font-weight:bold;font-style:italic;font-size:4vmin;margin:3% 0 0}
.ctl{flex:1;position:relative}
.dpad{position:absolute;left:0;top:18%;width:38%;aspect-ratio:1}
.dpad div{position:absolute;background:#3a3a52;box-shadow:0 3px 0 #1a1a2a}
.dpad .u{left:33%;top:0;width:34%;height:36%;border-radius:4px 4px 0 0}.dpad .d{left:33%;bottom:0;width:34%;height:36%;border-radius:0 0 4px 4px}
.dpad .l{left:0;top:33%;width:36%;height:34%;border-radius:4px 0 0 4px}.dpad .r{right:0;top:33%;width:36%;height:34%;border-radius:0 4px 4px 0}
.dpad .c{left:33%;top:33%;width:34%;height:34%}
.dpad div.p,.btn.p,.ss.p{filter:brightness(1.8)}
.ab{position:absolute;right:0;top:14%;width:48%;height:40%;transform:rotate(-25deg)}
.btn{position:absolute;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8362f);box-shadow:0 4px 0 #8a1a1a;color:#fff;font-weight:bold;display:flex;align-items:flex-end;justify-content:center}
.btn span{position:relative;bottom:-30%}.btn.b{left:0;top:30%;background:radial-gradient(circle at 35% 30%,#8ad0ff,#2f6fe0);box-shadow:0 4px 0 #1a3a8a}.btn.a{right:0;top:0}
.sss{position:absolute;bottom:14%;left:28%;width:44%;display:flex;justify-content:space-around}
.ss{width:34%;height:12px;border-radius:6px;background:#3a3a52;transform:rotate(-25deg);text-align:center;font-size:2vmin;color:#fff;line-height:30px}
/* overlays on screen */
.hud{position:absolute;left:2%;top:2%;font-size:.8em;color:#ff5c8a;background:#fffd;border:2px solid #2b1d33;padding:0 4px;border-radius:3px}
.dlg{position:absolute;left:2%;right:2%;bottom:2%;min-height:38%;background:linear-gradient(#2a3a9a,#1a2266);border:3px solid #fff;box-shadow:0 0 0 2px #2b1d33;border-radius:4px;padding:3% 4%;line-height:1.45;display:none}
.dlg .more{position:absolute;right:4%;bottom:2%;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.ch{position:absolute;right:2%;bottom:42%;background:linear-gradient(#2a3a9a,#1a2266);border:3px solid #fff;box-shadow:0 0 0 2px #2b1d33;border-radius:4px;padding:2% 4% 2% 2%;display:none;line-height:1.5}
.ch div{padding-left:1.1em;position:relative}.ch div.sel{color:#ffd23f}.ch div.sel::before{content:"▶";position:absolute;left:0}
.inp{position:absolute;left:2%;right:2%;top:6%;background:linear-gradient(#2a3a9a,#1a2266);border:3px solid #fff;border-radius:4px;padding:3%;display:none}
.inp input{width:100%;font:inherit;font-size:16px;padding:4px;border:2px solid #ffd23f;background:#fff;color:#2b1d33;outline:none;user-select:text;-webkit-user-select:text}
.inp button{margin-top:4px;width:100%;font:inherit;background:#ff5c8a;color:#fff;font-weight:bold;border:none;padding:4px;border-radius:3px}
.title{position:absolute;inset:0;background:linear-gradient(#5ab8ff,#8fe0ff 60%,#5cc85a 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center}
.title h1{margin:0;font-size:1.5em;color:#ffd23f;text-shadow:2px 2px 0 #c8322f,-1px -1px 0 #2b1d33}
.title img,.win img{width:78%;border:3px solid #fff;box-shadow:0 0 0 2px #2b1d33;image-rendering:pixelated}
.title .blink{color:#fff;text-shadow:1px 1px 0 #2b1d33}.blink{animation:bl 1s steps(2) infinite}
.win{position:fixed;inset:0;background:linear-gradient(160deg,#ff7aa2ee,#b26cffee);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-shadow:2px 2px 0 #5a1a6a;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-weight:bold;text-align:center;font-size:22px;z-index:5;padding:20px}
.win img{width:88%;max-width:420px;filter:none;border:4px solid #fff;border-radius:6px}
.fall{position:fixed;top:-40px;pointer-events:none;animation:f linear forwards;z-index:9}@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body>

for(let y=1;y<MH-1;y++)for(let x2=71;x2<79;x2++)if(M[y][x2]=='.'&&(x2+y)%3==0)M[y][x2]='f';

// ---- sprites (16x16 color) ----
const BODY=["....KKKKKKK.....","...KHHHHHHHK....","..KHHHHHHHHHK...","..KHHHHHHHHHK...","..KHSSSSSSSHK...","..KSSESSSESSK...","..KSSESSSESSK...","..KSLSSMSSLSK...","...KKSSSSSKK....","..KCCCCCCCCCK...",".KSKCCCCCCCKSK..",".KSKCCCCCCCKSK..","..KPPPPPPPPPK...","..KPPPPKPPPPK...","..KPPPK.KPPPK...","..KBBBK.KBBBK..."];

const HAT=r=>r.map((s,i)=>i==0?"...KKKKKKKKK....":i==1?"..KAAAAAAAAAK...":i==2?".KAAAAAAAAAAAK..":s);

const base={K:'#2b1d33',S:'#ffd3a6',E:'#2b1d33',M:'#e0576b',L:'#ffa4a4',G:'#9b5a2a',R:'#e8362f',A:'#f7c531'};
const CH={
hero:{m:BAND(BODY),p:{H:'#5a3a22',C:'#2f6fe0',P:'#2b2f55',B:'#7a4a22',R:'#e8362f'}},
heroB:{m:BAND(BACK),p:{H:'#5a3a22',C:'#2f6fe0',P:'#2b2f55',B:'#7a4a22',R:'#e8362f'}},
tong:{m:BODY,p:{H:'#1d1d24',C:'#ffd23f',P:'#3a5a9a',B:'#eeeeee'}},
v0:{m:HAT(BODY),p:{H:'#6a4a2a',C:'#8a4fc7',P:'#5a3a22',B:'#3b2a1a',A:'#7b4b2a'}},
v1:{m:HAT(BODY),p:{H:'#c0c0d0',C:'#3a2a8a',P:'#3a2a8a',B:'#222',A:'#5b2fbf'}},
v2:{m:BODY,p:{H:'#e05a1a',C:'#e8362f',P:'#222',B:'#222'}},
v3:{m:HAT(BODY),p:{H:'#6a4a2a',C:'#ffffff',P:'#555',B:'#222',A:'#ffffff'}},
v4:{m:HAT(BODY),p:{H:'#444',C:'#1fa2a8',P:'#e0b050',B:'#5a3a22',A:'#f2d16b'}},
v5:{m:HAT(BODY),p:{H:'#3a2a1a',C:'#2f6fe0',P:'#2b2f55',B:'#222',A:'#e8362f'}},v6:{m:BODY,p:{H:'#f2f2f2',C:'#2a8a4a',P:'#333',B:'#222'}}};
const TREE=["......KKKK......","....KKDDDDKK....","...KDDLLDDDDK...","..KDLLLLDDDDDK..","..KDLLDDDDDDDK..",".KDDDDDDDDLDDDK.",".KDDDDDDDLLDDDK.",".KDDLDDDDDDDDDK.","..KDDDDDDDDDDK..","..KKDDDDDDDDKK..","....KKDDDDKK....","......KTTK......","......KTTK......",".....KTTTTK.....","....KKKKKKKK....","................"];
const HEART=["................","..KKK....KKK....",".KRRRK..KRRRK...","KRWWRRKKRRRRRK..","KRWRRRRRRRRRRK..","KRRRRRRRRRRRRK..",".KRRRRRRRRRRK...","..KRRRRRRRRK....","...KRRRRRRK.....","....KRRRRK......",".....KRRK.......","......KK........"];
function drawM(m,p,px,py,flip){for(let j=0;j<m.length;j++)for(let i=0;i<16;i++){const c=m[j][flip?15-i:i];if(c&&c!='.'){x.fillStyle=p[c]||base[c];x.fillRect(px+i,py+j,1,1)}}}
function spr(n,px,py,s,flip){if(n=='tree')return drawM(TREE,{K:'#1b3a1f',D:'#2e8b3a',L:'#6ed35a',T:'#8a5a2b'},px,py-2);if(n=='heart')return drawM(HEART,{K:'#5a0a1a',R:'#ff3b6b',W:'#fff'},px,py);const c=CH[n];drawM(c.m,c.p,px,py,flip)}
function R(c,a,b,w,h){x.fillStyle=c;x.fillRect(a,b,w,h)}
function grass(px,py,mx,my){R((mx+my)%2?'#5cc85a':'#55bf53',px,py,16,16);x.fillStyle='#3e9e45';const s=mx*13+my*7;R('#3e9e45',px+(s%11),py+(s%7)+3,1,2);R('#3e9e45',px+((s*3)%13),py+((s*5)%11)+2,1,2);R('#7ee06a',px+((s*7)%14),py+((s*2)%12),1,1)}
function tile(t,px,py,mx,my){grass(px,py,mx,my);
 if(t=='='){R('#e2c48a',px,py+1,16,14);R('#cfae70',px,py+1,16,1);R('#cfae70',px,py+14,16,1);if(mx%3==0)R('#b8955a',px+5,py+7,2,1);if(mx%4==1)R('#f3dcaa',px+11,py+4,1,1)}
 else if(t=='T')spr('tree',px,py);
 else if(t=='f'){const cs=['#ff5c8a','#ffd23f','#ffffff','#b07cff'],c1=cs[(mx+my)%4],c2=cs[(mx*3+my+1)%4];R('#2f8a3a',px+5,py+9,1,4);R('#2f8a3a',px+11,py+8,1,4);
  for(const [a,b,c] of [[5,7,c1],[11,6,c2]]){R(c,px+a-1,py+b,3,1);R(c,px+a,py+b-1,1,3);R('#ffcc00',px+a,py+b,1,1)}}
 else if(t=='~'){R('#2f8fe8',px,py,16,16);R('#57b4ff',px,py,16,3);const o=(Math.floor(Date.now()/400)+mx)%2*4;R('#bfe6ff',px+2+o,py+5,5,1);R('#bfe6ff',px+8-o,py+11,5,1);R('#1c6fc0',px,py+15,16,1)}
 else if(t=='H'){R('#c8322f',px,py+3,16,13);R('#e8504a',px,py+3,16,2);for(let i=0;i<4;i++)R('#9e2220',px,py+7+i*3,16,1);R('#7a1a18',px,py+15,16,1)}
 else if(t=='h'||t=='d'){R('#f4e2b8',px,py,16,15);R('#c9a86e',px,py,16,1);R('#6a4a2a',px,py+15,16,1);if(t=='d'){R('#7a4a22',px+4,py+5,8,10);R('#a86a32',px+5,py+6,6,9);R('#ffd23f',px+9,py+10,1,1)}else{R('#6a4a2a',px+3,py+3,10,8);R('#8fd3ff',px+4,py+4,8,6);R('#ffffff',px+5,py+5,2,2);R('#6a4a2a',px+7,py+4,1,6);R('#ff7aa2',px+3,py+11,10,2)}}
 else if(t=='F'||t=='G'){if(t=='G'&&stage>=mx/10){R('#e2c48a',px,py+1,16,14);return}R('#8a5a2b',px+2,py+3,3,12);R('#8a5a2b',px+11,py+3,3,12);R('#b07a3a',px,py+5,16,2);R('#b07a3a',px,py+10,16,2);R('#5a3a1a',px,py+7,16,1);R('#5a3a1a',px,py+12,16,1);
  if(t=='G'){R('#d43a3a',px+5,py+1,6,14);R('#ff6a5a',px+6,py+2,4,1);R('#ffd23f',px+7,py+7,2,2)}}}
// ---- state ----
let state='title',hero={x:2,y:GY,dir:'right',px:32,py:GY*16,mv:0},held=null,camX=0;
const DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryMove(){if(state!='walk'||hero.mv||!held)return;const [dx,dy]=DIR[held];hero.dir=held;const nx=hero.x+dx,ny=hero.y+dy;if(solid(nx,ny)){return}hero.x=nx;hero.y=ny;hero.mv=1}
// dialog
let dq=[],dtext='',dpos=0,dmode=null,cur=0,after=null,active=null;
function say(lines,then){dq=lines.slice();after=then||null;state='talk';$('dlg').style.display='block';next()}
function next(){if(!dq.length){closeDlg();if(after){const f=after;after=null;f()}return}dtext=dq.shift();dpos=0;$('more').style.display='none'}
function closeDlg(){$('dlg').style.display='none';$('ch').style.display='none';$('inp').style.display='none';state=(state=='win')?'win':'walk';dmode=null}
function ask(q){state='talk';$('dlg').style.display='block';dq=[];dtext=q.n+'：「'+q.q+'」';dpos=0;$('more').style.display='none';after=null;
 dmode=q.t=='c'?'choice':'input';active=q}
function showAnswer(){if(dmode=='choice'){cur=0;rCh();$('ch').style.display='block'}else{$('iq').textContent=active.q;$('ii').value='';$('inp').style.display='block';setTimeout(()=>$('ii').focus(),50)}state='answer'}
function rCh(){$('ch').innerHTML=active.o.map((o,i)=>`<div class="${i==cur?'sel':''}">${o}</div>`).join('')}
function judge(v){const q=active;dmode=null;$('ch').style.display='none';$('inp').style.display='none';$('ii').blur();
 if(q.a.map(N).includes(N(v))){stage++;beep(660);setTimeout(()=>beep(990,.15),90);say([q.n+'：「答對了！太厲害了！」',stage<7?'前方的柵門打開了！往右前進吧！':'最後一道門打開了！快去找 Stone！'])}
 else{beep(150,.25,'sawtooth');say([q.n+'：「噗噗～答錯囉！」',q.h,'（再跟我說話試一次吧）'])}}
function talk(){const [dx,dy]=DIR[hero.dir];const tx=hero.x+dx,ty=hero.y+dy;
 if(tx==TONG.x&&ty==TONG.y){if(stage>=7){say(['Stone：「你終於來了！」','Stone：「七關全部答對，你真的很懂我！」'],victory)}else say(['Stone：「…」'])}
 const n=NPC.find(n=>n.x==tx&&n.y==ty);if(!n)return;const q=Q[n.k];beep(520);
 if(n.k<stage)say([q.n+'：「門已經打開囉，繼續前進吧！」']);else ask(q)}
function victory(){state='win';$('win').style.display='flex';beep(523,.15);setTimeout(()=>beep(659,.15),150);setTimeout(()=>beep(784,.15),300);setTimeout(()=>beep(1046,.4),450);burst(60);setTimeout(()=>burst(40),1300)}
function burst(n){for(let k=0;k<n;k++){const s=document.createElement('div');s.className='fall';s.textContent=['🎉','⭐','✨','🏆','🎊'][k%5];s.style.left=Math.random()*100+'vw';s.style.fontSize=18+Math.random()*22+'px';s.style.animationDuration=2+Math.random()*2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function start(){$('title').style.display='none';state='walk';beep(660);say(['旅人，歡迎來到冒險世界！','每一區都有一位村民會出題，靠近後按 A 對話。','答對就能打開柵門，闖過七關去找 Stone 吧！'])}
// ---- input ----
function press(k){
 if(state=='title'){if(k=='start'||k=='a')start();return}
 if(state=='win'){if(k=='b'){$('win').style.display='none';state='walk'}return}
 if(k=='select'){sound=!sound;return}
 if(state=='walk'){if(DIR[k]){held=k;hero.dir=k;tryMove()}else if(k=='a')talk();return}
 if(state=='talk'){if(k=='a'){if(dpos<dtext.length){dpos=dtext.length}else if(dmode){showAnswer()}else{beep(400,.03);next()}}else if(k=='b'){dq=[];after=null;closeDlg()}return}
 if(state=='answer'&&dmode=='choice'){if(k=='up'||k=='down'){cur=(cur+(k=='up'?-1:1)+active.o.length)%active.o.length;rCh();beep(440,.02)}else if(k=='a')judge(active.o[cur]);else if(k=='b')closeDlg();return}
 if(state=='answer'&&dmode=='input'&&k=='b'){$('ii').blur();closeDlg()}}
function release(k){if(held==k)held=null}
$('ib').addEventListener('click',()=>judge($('ii').value));$('ii').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter')judge($('ii').value)});
const act=new Map();
function upd(e){if(e.target.closest&&e.target.closest('.inp'))return;e.preventDefault();const now=new Set();for(const t of e.touches){const el=document.elementFromPoint(t.clientX,t.clientY);const k=el&&el.closest('[data-k]');if(k)now.add(k)}
for(const [el] of act)if(!now.has(el)){el.classList.remove('p');release(el.dataset.k);act.delete(el)}
for(const el of now)if(!act.has(el)){el.classList.add('p');act.set(el,1);press(el.dataset.k)}}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>document.addEventListener(n,upd,{passive:false}));
document.addEventListener('mousedown',e=>{const k=e.target.closest('[data-k]');if(k){k.classList.add('p');press(k.dataset.k);const u=()=>{k.classList.remove('p');release(k.dataset.k);removeEventListener('mouseup',u)};addEventListener('mouseup',u)}});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
const K={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',x:'b',Enter:'start',Shift:'select',' ':'a'};
addEventListener('keydown',e=>{const k=K[e.key];if(k){e.preventDefault();if(!e.repeat)press(k)}});addEventListener('keyup',e=>{const k=K[e.key];if(k)release(k)});
// ---- loop ----
let last=0,tt=0;
function loop(t){x.setTransform(2,0,0,2,0,0);x.imageSmoothingEnabled=false;const dt=Math.min(50,t-last);last=t;
 if(hero.mv){const tx=hero.x*16,ty=hero.y*16,sp=dt*16/160;hero.px+=Math.sign(tx-hero.px)*Math.min(sp,Math.abs(tx-hero.px));hero.py+=Math.sign(ty-hero.py)*Math.min(sp,Math.abs(ty-hero.py));if(hero.px==tx&&hero.py==ty){hero.mv=0;tryMove()}}
 if(state=='talk'&&dpos<dtext.length){tt+=dt;while(tt>35&&dpos<dtext.length){tt-=35;dpos++}$('dt').textContent=dtext.slice(0,dpos);if(dpos>=dtext.length){$('more').style.display='block';if(dmode)showAnswer()}}
 camX=Math.max(0,Math.min(MW*16-160,hero.px-72));const cy=0;
 const c0=Math.floor(camX/16);for(let j=0;j<MH;j++)for(let i=c0;i<=c0+10&&i<MW;i++)tile(M[j][i],i*16-camX|0,j*16-cy,i,j);
 NPC.forEach(n=>{spr('v'+n.k,n.x*16-camX|0,n.y*16-cy);if(n.k==stage&&state=='walk'&&Math.floor(t/400)%2){x.fillStyle='#ffd23f';x.fillRect(n.x*16-camX+7|0,n.y*16-6,2,4);x.fillRect(n.x*16-camX+7|0,n.y*16-1,2,1)}});
 spr('tong',TONG.x*16-camX|0,TONG.y*16-cy);if(stage>=7&&Math.floor(t/400)%2){x.fillStyle='#ffd23f';x.fillRect(TONG.x*16-camX+7|0,TONG.y*16-6,2,4);x.fillRect(TONG.x*16-camX+7|0,TONG.y*16-1,2,1)}
 spr(hero.dir=='up'?'heroB':'hero',hero.px-camX|0,hero.py-cy+(hero.mv&&Math.floor(t/120)%2?-1:0),1,hero.dir=='left');
 $('hud').textContent='第'+Math.min(stage+1,7)+'關 '+'★'.repeat(stage)+'☆'.repeat(7-stage);
 $('led').className='led'+(state!='title'?' on':'');requestAnimationFrame(loop)}
function fit(){$('scr').style.fontSize=($('scr').clientWidth/17)+'px'}addEventListener('resize',fit);fit();
requestAnimationFrame(loop);
